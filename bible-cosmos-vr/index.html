<title>Библейский космос</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: full-screen WebGL sky; thin glass HUD pinned to the screen edges. Single deliberate dark look. */
  :root {
    --void: #04050c;
    --ink: #e8ebf6;
    --dim: #9aa2bf;
    --glass: rgba(10, 13, 28, 0.74);
    --line: rgba(150, 165, 215, 0.2);
    --gold: #f3c35b;
    --gold-ink: #1b1405;
    --font-title: "Cormorant Garamond", "PT Serif", Georgia, serif;
    --font-text: "PT Serif", Georgia, "Times New Roman", serif;
    --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.pointing { cursor: pointer; }
  #stage canvas:active { cursor: grabbing; }

  .hud { position: fixed; z-index: 5; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  #top {
    top: 0; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--font-title); font-weight: 600; font-size: 26px; letter-spacing: 0.02em; text-shadow: 0 1px 12px #000; }
  #crumbs { display: flex; gap: 4px; align-items: center; font-size: 14px; color: var(--dim); flex-wrap: wrap; }
  #crumbs button { all: unset; cursor: pointer; color: var(--ink); padding: 2px 4px; border-radius: 4px; }
  #crumbs button:hover, #crumbs button:focus-visible { color: var(--gold); outline: 1px solid var(--line); }
  #crumbs span.sep { opacity: 0.5; }
  #crumbs span.here { color: var(--gold); padding: 2px 4px; }

  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #search { display: flex; }
  #q {
    width: 150px; font: 15px var(--font-ui); color: var(--ink); background: var(--glass);
    border: 1px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; padding: 8px 10px; outline: none;
  }
  #q:focus-visible { border-color: var(--gold); }
  #q::placeholder { color: var(--dim); }
  .btn {
    font: 500 14px var(--font-ui); color: var(--ink); background: var(--glass); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: rgba(243, 195, 91, 0.6); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #search .btn { border-radius: 0 8px 8px 0; }
  .lang { display: flex; }
  .lang .btn { border-radius: 0; padding-inline: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--dim); }
  .lang .btn:first-child { border-radius: 8px 0 0 8px; border-right: 0; }
  .lang .btn:last-child { border-radius: 0 8px 8px 0; }
  .lang .btn[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }

  #info {
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(460px, calc(100vw - 32px)); padding: 14px 16px; pointer-events: none;
  }
  #info .ref { font: 600 12px var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
  #info .title { font: 600 24px/1.1 var(--font-title); margin-top: 4px; }
  #info .meta { font-size: 13px; color: var(--dim); margin-top: 2px; }
  #info .text { font: 17px/1.5 var(--font-text); margin-top: 8px; max-height: 40vh; overflow: hidden; }
  #info .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }

  #nav {
    left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  body.has-info #nav { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; }

  #legend {
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding: 10px 12px; font-size: 13px; display: grid; gap: 5px; max-width: 260px;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; background: currentColor; }
  #legend .head { font: 600 11px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  #legend .note { font-size: 12px; color: var(--dim); margin-top: 4px; }

  #toast {
    left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    padding: 9px 14px; font-size: 14px; color: var(--ink); text-align: center; max-width: calc(100vw - 32px);
    transition: opacity 0.6s;
  }
  #toast.gone { opacity: 0; pointer-events: none; }
  #toast { z-index: 7; background: rgba(10, 13, 28, 0.94); }

  #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--void); transition: opacity 0.8s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { width: min(360px, calc(100vw - 32px)); text-align: center; }
  #loader h2 { font: 600 34px var(--font-title); margin: 0 0 6px; }
  #loader p { color: var(--dim); margin: 0 0 18px; font: 16px var(--font-text); font-style: italic; }
  #loader .bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #loader .bar div { height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
  #loader .status { margin-top: 10px; font-size: 13px; color: var(--dim); }

  #detail {
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    width: min(390px, calc(100vw - 32px)); overflow-y: auto; padding: 14px 16px 12px;
  }
  #detail .close {
    position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 16px; cursor: pointer;
  }
  #detail .close:hover, #detail .close:focus-visible { border-color: var(--gold); outline: none; }
  #detail .ref { font: 600 12px var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding-right: 40px; }
  #detail .text { font: 18px/1.5 var(--font-text); margin: 6px 0 10px; }
  #detail .actions { display: flex; gap: 8px; margin-bottom: 4px; }
  #detail h3, #bookInfo h3 {
    font: 600 11px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
    margin: 14px 0 6px; text-wrap: balance;
  }
  #bookInfo h3 { margin-top: 0; color: var(--gold); }
  #detail ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #detail ul.links button {
    all: unset; box-sizing: border-box; display: grid; gap: 2px; width: 100%; padding: 7px 9px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer;
  }
  #detail ul.links button:hover, #detail ul.links button:focus-visible { border-color: var(--line); background: rgba(143, 196, 255, 0.07); }
  #detail ul.links .r { font: 600 13px var(--font-ui); color: var(--gold); }
  #detail ul.links .t {
    font: 14px/1.4 var(--font-text); color: var(--dim);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #detail dl, #bookInfo dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  #detail dt, #bookInfo dt { color: var(--dim); }
  #detail dd, #bookInfo dd { margin: 0; min-width: 0; }
  #detail .circ, #bookInfo .circ { font: italic 15px/1.45 var(--font-text); color: #f6e7c1; margin: 10px 0 0; }
  #detail .muted, #bookInfo .muted { color: var(--dim); margin: 8px 0 0; }
  #detail .small, #bookInfo .small { font-size: 12px; }
  #bookInfo { left: max(16px, env(safe-area-inset-left, 0px)); width: min(380px, calc(100vw - 32px)); max-height: 42vh; overflow-y: auto; padding: 14px 16px; }

  @media (max-width: 720px) {
    #detail { left: max(16px, env(safe-area-inset-left, 0px)); top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 58vh; }
    body.has-detail #info, body.has-detail #nav { display: none; }
    #bookInfo { max-height: 30vh; }
    .brand h1 { font-size: 21px; }
    #q { width: 110px; }
    #legend { display: none; }
    body.legend-open #legend { display: grid; bottom: auto; top: calc(120px + env(safe-area-inset-top, 0px)); }
    #info .text { font-size: 15px; max-height: 28vh; }
    body.has-info #nav { left: 50%; right: auto; transform: translateX(-50%); bottom: auto; top: calc(120px + env(safe-area-inset-top, 0px)); }
  }
  @media (min-width: 721px) { body:not(.legend-closed) #legendToggle { display: none; } }
  .menu { position: relative; }
  #menuList {
    position: fixed; z-index: 20; display: grid; gap: 6px; padding: 8px;
    min-width: 200px; max-width: calc(100vw - 24px); border-radius: 10px;
    background: rgba(10, 13, 28, 0.97);
  }
  #menuList .btn { text-align: left; }
  #quiz {
    left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 160px);
    overflow-y: auto; padding: 16px 18px 14px; z-index: 6;
  }
  #quiz .close { position: absolute; top: 8px; right: 8px; }
  #quiz .ref { font: 600 12px var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding-right: 40px; }
  #quiz .muted { color: var(--dim); margin: 8px 0 0; font-size: 14px; }
  #quiz .text { font: 19px/1.5 "Lora", var(--font-text); margin: 6px 0 12px; }
  #quiz .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #quiz .opt { white-space: normal; text-align: left; min-height: 44px; }
  #quiz .opt.right { border-color: #5fd08a; background: rgba(95, 208, 138, 0.18); }
  #quiz .opt.wrong { border-color: #ff7a6e; background: rgba(255, 122, 110, 0.16); }
  #quiz .opt:disabled { cursor: default; opacity: 1; }
  #quiz .fb { font: 600 15px var(--font-ui); margin: 12px 0 0; }
  #quiz .fb.right { color: #7fe0a0; }
  #quiz .fb.wrong { color: #ff9a8f; }
  #quiz .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #bookInfo .bio, #detail .bio { font: 15px/1.5 var(--font-text); margin: 4px 0 0; }
  #bookInfo .actions { margin-top: 10px; }
  #bookInfo { max-height: 55vh; }
  @media (max-width: 520px) { #quiz .opts { grid-template-columns: 1fr; } }
  #info, #detail, #bookInfo, #quiz, #listPanel, #votd, #settingsPanel { zoom: var(--ts, 1); }
  #listPanel {
    left: max(16px, env(safe-area-inset-left, 0px)); width: min(380px, calc(100vw - 32px));
    max-height: calc(100vh - 200px); overflow-y: auto; padding: 14px 16px; z-index: 6;
  }
  #listPanel h3, #settingsPanel h3 {
    font: 600 12px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
    margin: 0 0 8px; padding-right: 36px;
  }
  #listPanel .close, #settingsPanel .close, #votd .close { position: absolute; top: 8px; right: 8px; }
  #listPanel .muted, #settingsPanel .muted { color: var(--dim); margin: 6px 0 8px; }
  #listPanel .small, #settingsPanel .small { font-size: 12px; }
  #listPanel ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #listPanel ul.links button {
    all: unset; box-sizing: border-box; display: grid; gap: 2px; width: 100%; padding: 7px 9px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer;
  }
  #listPanel ul.links button:hover, #listPanel ul.links button:focus-visible { border-color: var(--line); background: rgba(143, 196, 255, 0.07); }
  #listPanel ul.links .r { font: 600 14px var(--font-ui); color: var(--gold); }
  #listPanel ul.links .t {
    font: 14px/1.4 var(--font-text); color: var(--dim);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #listPanel ul.links .t:empty { display: none; }
  #settingsPanel {
    right: max(16px, env(safe-area-inset-right, 0px)); width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 160px); overflow-y: auto; padding: 14px 16px; z-index: 9;
  }
  #settingsPanel .set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  #settingsPanel .set-label { flex: 1 1 100%; font-size: 13px; color: var(--dim); }
  #settingsPanel .set-val { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  #settingsPanel input[type="range"] { flex: 1; accent-color: var(--gold); }
  #settingsPanel input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }
  #settingsPanel select { flex: 1; min-width: 0; font: 14px var(--font-ui); color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #settingsPanel .btn.danger { margin-top: 6px; border-color: rgba(255, 122, 110, 0.5); }
  #votd {
    left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    width: min(480px, calc(100vw - 32px)); padding: 14px 16px; z-index: 6;
  }
  #votd .ref { font: 600 12px var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding-right: 40px; }
  #votd .text { font: 18px/1.5 "Lora", var(--font-text); margin: 8px 0 10px; }
  #votd .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #continueBtn { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  @media (max-width: 720px) {
    #listPanel { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 55vh; }
    #settingsPanel { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; }
    body.has-info #continueBtn { display: none; }
  }
  body.legend-closed #legend { display: none !important; }
  .brand-btn { all: unset; cursor: pointer; font: inherit; }
  .brand-btn:hover, .brand-btn:focus-visible { color: var(--gold); }
  #toast { display: flex; align-items: center; gap: 10px; padding-right: 8px; }
  .close {
    flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 14px; cursor: pointer;
  }
  .close:hover, .close:focus-visible { border-color: var(--gold); outline: none; }
  #legend { position: fixed; padding-top: 12px; }
  #legend #legendClose, #bookInfo .close { position: absolute; top: 8px; right: 8px; }
  #bookInfo h3 { padding-right: 36px; }
  #hintsBtn[aria-pressed="false"] { color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { #toast, #loader { transition: none; } }
</style>

<div id="stage"></div>

<header id="top" class="hud">
  <div class="brand">
    <h1><button id="brand" type="button" class="brand-btn" data-i18n="title" data-i18n-title="homeTitle">Библейский космос</button></h1>
    <nav id="crumbs" aria-label="Где вы сейчас" data-i18n-label="crumbs"></nav>
  </div>
  <div class="tools">
    <form id="search" role="search">
      <label for="q" hidden data-i18n="searchLabel">Перейти к месту</label>
      <input id="q" name="q" placeholder="Ин 3:16" data-i18n-ph="searchPh" autocomplete="off" spellcheck="false">
      <button class="btn" type="submit" data-i18n="search">Найти</button>
    </form>
    <button id="home" class="btn" type="button" data-i18n="home" data-i18n-title="homeTitle">⌂ В начало</button>
    <div class="lang" role="group" aria-label="Язык / Limba">
      <button id="langRu" class="btn" type="button" aria-pressed="true">RU</button>
      <button id="langRo" class="btn" type="button" aria-pressed="false">RO</button>
    </div>
    <button id="random" class="btn" type="button" data-i18n="random">✦ Случайный стих</button>
    <button id="quizBtn" class="btn" type="button" data-i18n="quiz">Викторина</button>
    <div class="menu">
      <button id="menuBtn" class="btn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="menu">☰ Ещё</button>
      <div id="menuList" class="glass" hidden>
        <button id="bmBtn" class="btn" type="button" data-i18n="bookmarks">Закладки</button>
        <button id="topicsBtn" class="btn" type="button" data-i18n="topics">Созвездия тем</button>
        <button id="votdBtn" class="btn" type="button" data-i18n="votd">Стих дня</button>
        <button id="settingsBtn" class="btn" type="button" data-i18n="settings">Настройки</button>
        <button id="fileBtn" class="btn" type="button" title="Открыть свой файл Библии. Файл не покидает ваше устройство." data-i18n="own" data-i18n-title="ownTitle2">Свой перевод…</button>
        <button id="legendToggle" class="btn" type="button" data-i18n="genresBtn">Жанры</button>
        <button id="hintsBtn" class="btn" type="button" aria-pressed="true" data-i18n-title="hintsTitle">Подсказки: вкл</button>
      </div>
    </div>
    <input id="file" type="file" accept=".epub,.rtf,.zip,.json,application/epub+zip,application/zip,application/json" multiple hidden>
    <button id="vr" class="btn primary" type="button" disabled>Проверяем VR…</button>
  </div>
</header>

<div id="toast" class="hud glass gone" role="status"><span id="toastText"></span><button id="toastClose" type="button" class="close" aria-label="Скрыть подсказку" data-i18n-label="hideHint">✕</button></div>

<aside id="info" class="hud glass" hidden aria-live="polite">
  <div class="ref"></div>
  <div class="title"></div>
  <div class="meta"></div>
  <div class="text"></div>
  <div class="hint"></div>
</aside>

<div id="nav" class="hud" hidden>
  <button id="prevCh" class="btn" type="button" data-i18n="prevCh">◀ Предыдущая глава</button>
  <button id="prevPage" class="btn" type="button" hidden data-i18n="prevPage">◀ Стр.</button>
  <button id="listen" class="btn primary" type="button" aria-pressed="false">▶ Слушать главу</button>
  <button id="nextPage" class="btn" type="button" hidden data-i18n="nextPage">Стр. ▶</button>
  <button id="nextCh" class="btn" type="button" data-i18n="nextCh">Следующая глава ▶</button>
</div>

<aside id="listPanel" class="hud glass" hidden aria-live="polite"></aside>
<aside id="settingsPanel" class="hud glass" hidden></aside>
<aside id="votd" class="hud glass" hidden aria-live="polite"></aside>
<button id="continueBtn" class="hud btn primary" type="button" hidden></button>
<aside id="quiz" class="hud glass" hidden aria-live="polite"></aside>
<aside id="detail" class="hud glass" hidden aria-live="polite"></aside>
<aside id="bookInfo" class="hud glass" hidden></aside>

<aside id="legend" class="hud glass" aria-label="Цвета жанров" data-i18n-label="legendLabel"><button id="legendClose" type="button" class="close" aria-label="Закрыть" data-i18n-label="close">✕</button></aside>

<div id="loader">
  <div class="box">
    <h2 data-i18n="title">Библейский космос</h2>
    <p data-i18n="quote">«Он исчисляет звёзды, всех их называет по имени» (Пс 146:4)</p>
    <div class="bar"><div id="bar"></div></div>
    <div class="status" id="status" data-i18n="loading">Загружаем текст…</div>
  </div>
</div>

<script>
  // Если программа не стартовала, показываем причину вместо бесконечной загрузки.
  (function () {
    var ro = false;
    try { ro = (localStorage.getItem('lang') || navigator.language || '').toLowerCase().indexOf('ro') === 0; } catch (e) {}
    function say(msg) { var s = document.getElementById('status'); if (s && !window.__started) s.textContent = msg; }
    window.addEventListener('error', function (e) {
      var what = e.message || (e.target && (e.target.src || e.target.href)) || '';
      say((ro ? 'Eroare la pornire: ' : 'Ошибка запуска: ') + what);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      say((ro ? 'Eroare la pornire: ' : 'Ошибка запуска: ') + ((e.reason && e.reason.message) || e.reason));
    });
    setTimeout(function () {
      if (!window.__appRan) say(ro
        ? 'Biblioteca 3D nu s-a încărcat. Verificați internetul sau deschideți linkul în Chrome.'
        : 'Не загрузилась библиотека 3D-графики. Проверьте интернет или откройте ссылку в браузере Chrome.');
    }, 15000);
  })();
</script>
