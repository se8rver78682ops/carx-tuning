# Собирает APK «Библейского космоса» для Android и прикладывает его к запуску как артефакт.
name: Bible Cosmos APK

on:
  push:
    paths:
      - 'bible-cosmos-vr/**'
      - '.github/workflows/bible-cosmos-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Android SDK уже установлен на ubuntu-latest (ANDROID_HOME); Gradle сам докачает нужную платформу.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Prepare web assets
        run: bash bible-cosmos-vr/android/prepare-assets.sh

      - name: Build debug APK
        run: gradle -p bible-cosmos-vr/android assembleDebug --no-daemon

      - name: Rename APK
        run: cp bible-cosmos-vr/android/app/build/outputs/apk/debug/app-debug.apk bible-cosmos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bible-cosmos-apk
          path: bible-cosmos.apk
