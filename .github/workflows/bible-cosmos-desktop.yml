# Собирает «Библию» для компьютера (Electron): Windows (установщик и переносная версия), Linux (AppImage), macOS (dmg).
name: Bible Cosmos desktop

on:
  push:
    paths:
      - 'bible-cosmos-vr/**'
      - '.github/workflows/bible-cosmos-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            artifact: bible-windows
          - os: ubuntu-latest
            args: --linux AppImage --x64
            artifact: bible-linux
          - os: macos-latest
            args: --mac dmg --arm64 --x64
            artifact: bible-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: bible-cosmos-vr/desktop
        run: npm install --no-audit --no-fund

      # Проверка помощника голосов Windows (наш voice.ps1, голоса самой системы): список голосов и WAV-файл.
      - name: Voice helper test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: bible-cosmos-vr/desktop
        run: |
          $lines = '{"cmd":"voices"}' | powershell -NoProfile -ExecutionPolicy Bypass -File voice.ps1 -Dir $env:RUNNER_TEMP
          $lines
          $v = ($lines | Where-Object { $_ -like 'V*' } | Select-Object -First 1)
          $voices = @()
          if ($v) { $voices = @($v.Substring(1) | ConvertFrom-Json) }
          "voices: $($voices.Count)"
          if ($voices.Count -eq 0) { Write-Warning 'no voices on this machine'; exit 0 }
          foreach ($id in @(($voices | Where-Object { $_.id -like 'rt:*' } | Select-Object -First 1).id, ($voices | Where-Object { $_.id -like 'sapi:*' } | Select-Object -First 1).id)) {
            if (-not $id) { continue }
            $req = (@{ t = 'Hello. This is a voice test.'; v = $id; r = 1 } | ConvertTo-Json -Compress)
            $res = $req | powershell -NoProfile -ExecutionPolicy Bypass -File voice.ps1 -Dir $env:RUNNER_TEMP
            "$id -> $res"
            if (-not ($res -like 'F*.wav')) { throw "voice helper failed for $id" }
            $f = $res.Substring(1); "size: $((Get-Item $f).Length) bytes"
            if ((Get-Item $f).Length -lt 2000) { throw 'wav too small' }
          }

      # Нейросетевой голос Piper (с разрешения владельца): синтезатор github.com/rhasspy/piper
      # и голоса «Ирина» (RU) и «Михай» (RO) из huggingface.co/rhasspy/piper-voices. Работает без интернета.
      - name: Piper for Windows
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: bible-cosmos-vr/desktop
        run: |
          Invoke-WebRequest -Uri https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath .
          Remove-Item piper.zip
          Get-ChildItem piper | Select-Object -First 12

      - name: Piper for Linux
        if: runner.os == 'Linux'
        working-directory: bible-cosmos-vr/desktop
        run: |
          curl -sSfL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar -xz -C .
          ls piper | head -20

      - name: Piper voices
        if: runner.os != 'macOS'
        shell: bash
        working-directory: bible-cosmos-vr/desktop
        run: |
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          for f in ru/ru_RU/irina/medium/ru_RU-irina-medium ru/ru_RU/ruslan/medium/ru_RU-ruslan-medium ro/ro_RO/mihai/medium/ro_RO-mihai-medium; do
            n=$(basename "$f")
            curl -sSfL -o "voices/$n.onnx" "$base/$f.onnx"
            curl -sSfL -o "voices/$n.onnx.json" "$base/$f.onnx.json"
          done
          ls -la voices

      - name: Piper test (one phrase in each language)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: bible-cosmos-vr/desktop
        run: |
          exe=piper/piper; [ "$RUNNER_OS" = "Windows" ] && exe=piper/piper.exe
          export LD_LIBRARY_PATH="$PWD/piper"
          mkdir -p voicetest
          printf 'Вначале Бог сотворил небо и землю.\n' | "$exe" --model voices/ru_RU-irina-medium.onnx --output_dir voicetest | tee ru.txt
          printf 'Моисей вывел народ из Египта.\n' | "$exe" --model voices/ru_RU-ruslan-medium.onnx --output_dir voicetest | tee ru2.txt
          printf 'La început, Dumnezeu a creat cerurile și pământul.\n' | "$exe" --model voices/ro_RO-mihai-medium.onnx --output_dir voicetest | tee ro.txt
          grep -qi 'wav' ru.txt && grep -qi 'wav' ru2.txt && grep -qi 'wav' ro.txt
          ls -la voicetest
          rm -rf voicetest ru.txt ru2.txt ro.txt

      - name: Empty voice folders on macOS (system voices are used)
        if: runner.os == 'macOS'
        run: mkdir -p bible-cosmos-vr/desktop/piper bible-cosmos-vr/desktop/voices

      - name: Build
        working-directory: bible-cosmos-vr/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node prepare.js && npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bible-cosmos-vr/desktop/dist/*.exe
            bible-cosmos-vr/desktop/dist/*.AppImage
            bible-cosmos-vr/desktop/dist/*.dmg
          if-no-files-found: error
